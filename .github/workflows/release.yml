name: Release Linux Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux artifacts
        run: npm run dist:linux:all

      - name: Pack linux-unpacked
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C dist-electron -czf alogi-${VERSION}-linux-unpacked.tar.gz linux-unpacked
          cp alogi-${VERSION}-linux-unpacked.tar.gz alogi-linux-unpacked.tar.gz

      - name: Prepare Arch package sources
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C dist-electron -czf packaging/arch/linux-unpacked.tar.gz linux-unpacked
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD

      - name: Build Arch package
        run: |
          docker run --rm \
            -e HOST_UID=$(id -u) \
            -e HOST_GID=$(id -g) \
            -v "$PWD:/repo" \
            archlinux:latest /bin/bash -c "\
            pacman -Sy --noconfirm base-devel gtk3 nss libxss libxtst alsa-lib libxrandr libxkbcommon libxcomposite libxdamage libxfixes libxi libxrender libxcursor at-spi2-core libdrm mesa libnotify libcups pango cairo dbus glib2 && \
            groupadd -g \${HOST_GID} builder || true && \
            useradd -m -u \${HOST_UID} -g \${HOST_GID} builder || true && \
            chown -R \${HOST_UID}:\${HOST_GID} /repo && \
            su - builder -c 'cd /repo/packaging/arch && makepkg -f --noconfirm --needed'"

      - name: Collect Arch package
        run: |
          PKG=$(ls packaging/arch/alogi-*.pkg.tar.zst | head -n1)
          cp "$PKG" alogi-arch.pkg.tar.zst

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            alogi-*-linux-unpacked.tar.gz
            alogi-arch.pkg.tar.zst
