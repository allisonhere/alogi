name: Release Linux Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux artifacts
        run: npm run dist:linux:all

      - name: Pack linux-unpacked
        run: |
          VERSION=$(node -p "require('./package.json').version")
          tar -C dist-electron -czf alogi-${VERSION}-linux-unpacked.tar.gz linux-unpacked
          cp alogi-${VERSION}-linux-unpacked.tar.gz alogi-linux-unpacked.tar.gz

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            alogi-*-linux-unpacked.tar.gz
