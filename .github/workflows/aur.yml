name: Publish AUR

on:
  workflow_run:
    workflows: ["Release Linux Artifacts"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: false

permissions:
  contents: read

jobs:
  aur:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            TAG_FROM_SHA=$(git tag --points-at "$HEAD_SHA" | grep '^v' | head -n1 || true)
            if [ -n "$TAG_FROM_SHA" ]; then
              VERSION="${TAG_FROM_SHA#v}"
            elif [[ "${{ github.event.workflow_run.head_branch }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VERSION="${{ github.event.workflow_run.head_branch }}"
              VERSION="${VERSION#v}"
            else
              echo "Unable to resolve version from workflow_run payload" >&2
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download release tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          curl -fL -o "alogi-${VERSION}-linux-unpacked.tar.gz" \
            "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/alogi-${VERSION}-linux-unpacked.tar.gz"
          tar -tzf "alogi-${VERSION}-linux-unpacked.tar.gz" | grep -q '^linux-unpacked/'
          SHA256=$(sha256sum "alogi-${VERSION}-linux-unpacked.tar.gz" | awk '{print $1}')
          echo "SHA256=$SHA256" >> $GITHUB_ENV

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Add AUR host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Clone AUR repo
        run: |
          if [ -z "${{ secrets.AUR_REPO }}" ]; then
            echo "AUR_REPO secret not set" >&2
            exit 1
          fi
          git clone "${{ secrets.AUR_REPO }}" aur-repo
          cd aur-repo
          if git show-ref --verify --quiet refs/remotes/origin/master; then
            git checkout -B master origin/master
          elif git show-ref --verify --quiet refs/remotes/origin/main; then
            git checkout -B main origin/main
          else
            git checkout -B master
          fi

      - name: Prepare PKGBUILD
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp packaging/arch/aur/PKGBUILD aur-repo/PKGBUILD
          cp packaging/arch/alogi.desktop aur-repo/alogi.desktop
          cp packaging/arch/aur/icon.png aur-repo/icon.png
          sed -i "s/__VERSION__/${VERSION}/g" aur-repo/PKGBUILD
          sed -i "s/__SHA256__/${SHA256}/g" aur-repo/PKGBUILD

      - name: Generate .SRCINFO
        run: |
          docker run --rm \
            -e HOST_UID=$(id -u) \
            -e HOST_GID=$(id -g) \
            -v "$PWD/aur-repo:/pkg" \
            archlinux:latest /bin/bash -c "\
            pacman -Sy --noconfirm base-devel && \
            groupadd -g \${HOST_GID} builder || true && \
            useradd -m -u \${HOST_UID} -g \${HOST_GID} builder || true && \
            chown -R \${HOST_UID}:\${HOST_GID} /pkg && \
            su - builder -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'"

      - name: Commit & push
        run: |
          cd aur-repo
          if git diff --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add PKGBUILD .SRCINFO alogi.desktop icon.png
          git commit -m "Release ${{ steps.version.outputs.version }}"
          git push
